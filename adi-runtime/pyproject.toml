[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adi-runtime"
version = "0.1.0"
description = "Local-first runtime for agents that talk, see, and act on real devices"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
classifiers = ["License :: OSI Approved :: GNU Affero General Public License v3"]

[project.scripts]
adi-runtime = "adi_runtime.__main__:main"

[tool.setuptools.packages.find]
include = ["adi_runtime*"]
